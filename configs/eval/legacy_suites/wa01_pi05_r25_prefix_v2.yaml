# Formal 50-seed WA-01 pi0.5 evaluation with 25-step replanning.
suite_version: wa01_pi05_r25_prefix_v2
task:
  id: WA-01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wa01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml
seeds: {start: 1050, stop: 1100}
rollout:
  replan_steps: 25
  action_repeat: 1
  stop_on_success: true
  ignore_done: true
artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20
transport:
  timeout_s: 300.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0

# Fixed expert subtasks; max_steps counts policy steps after the single handoff.
expert_prefix:
  profile: wa01_sugar_v1
  root: outputs/evaluation_prefixes/wa01_sugar_v1
