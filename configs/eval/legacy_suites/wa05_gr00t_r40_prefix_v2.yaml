# GR00T-compatible 50-seed WA-05 suite for checkpoints with a 40-action horizon.
suite_version: wa05_gr00t_r40_prefix_v2
task:
  id: WA-05
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wa05/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml
seeds: {start: 1050, stop: 1100}
rollout:
  replan_steps: 40
  action_repeat: 1
  stop_on_success: true
  ignore_done: true
artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20
transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0

# Fixed expert subtasks; max_steps counts policy steps after the single handoff.
expert_prefix:
  profile: wa05_pick_fill_v1
  root: outputs/evaluation_prefixes/wa05_pick_fill_v1
