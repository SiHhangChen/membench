suite_version: wx01_diffusion_r1_v1
task:
  id: WX-01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wx01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml
seeds: {start: 1050, stop: 1100}
# The task hard horizon is 3200, but all 200 training episodes finish in
# 783-926 frames; use a data-aligned evaluation budget with a practical margin.
rollout: {max_steps: 1200, replan_steps: 1, action_repeat: 1, stop_on_success: true, ignore_done: true}
artifacts: {record_video: true, video_cameras: [agentview_left, agentview_right, eye_in_hand], video_fps: 20}
transport: {timeout_s: 30.0, connect_attempts: 10, connect_retry_delay_s: 2.0, inference_retries: 0}
