# WA-05 production configuration. Recorder output paths remain CLI-owned.
schema_version: 1

task:
  id: WA-05
  display_name: Match one cup's water temperature with a button
  description: Fill one cup with either hot or cold water, stage it, then press the matching red or blue button.
  success_conditions:
    - single_cup_filled
    - single_temperature_fill
    - cup_staged_before_answer
    - physical_answer_button_pressed
    - answer_matches_filled_temperature

scene:
  env_name: WA05FillOneCupAndMatchTemperatureButton
  fixed_scene: true
  layout_id: 15
  style_id: 34
  scene_seed: 0

episode:
  expert_fill_temperature: null
  max_horizon: 4000

initial_state:
  robot_base:
    mode: station_sample
    station_id: cup_pick_station
  objects:
    cups:
      cup_A:
        # Match the right-hand cup region used by WA-02 (its cup_B area).
        region_center_xy: [0.8310, -0.4700]
        region_size_xy: [0.1200, 0.1200]
        yaw_rad: -0.0103
    cup_region_constraints:
      # Measured from the complete sink fixture footprint, not just the basin.
      sink_exterior_local_x_max: 0.37005
      minimum_sink_clearance: 0.070
      minimum_inter_region_gap: 0.070
      # The 12 x 12 cm regions above remain the legal hard boundaries. Sample
      # 3 mm inward on every side so contact settling cannot escape them.
      sampling_inset_xy: [0.003, 0.003]
    service_slots:
      # Fixed 12 x 12 cm service region on the counter outer-edge strip.
      # slot_1 is shifted 5 cm farther left along counter-local X.
      regions:
        slot_1:
          region_center_xy: [-1.145, -0.500]
          region_size_xy: [0.1200, 0.120]
      # Retained for configuration-schema compatibility. Placement targets are
      # now fixed at each region center, so this margin is not used for sampling.
      placement_center_margin_xy: [0.040, 0.040]
      surface_z_offset: 0.003
      minimum_xy_separation: 0.20
      minimum_inter_region_gap: 0.070
    fill_under_water_steps: 40
    service_threshold: 0.12
    cup_upright_threshold_deg: 15.0

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  manual_base_path: navigation/manual_base_path_layout15_style34_seed0.json
  station_poses: station/stations.json
  sensor_faucet_layout: poses/sensor_faucet_layout_layout15_style34_seed0.json
  answer_button_positions: poses/answer_button_positions_layout15_style34_seed0.json
  cup_grasp_candidates: poses/water_cup_grasp_candidates.json
  sink_fill_pose: poses/sink_cup_place_pose_layout15_style34_seed0.json
  planner_script: ../../../execution/planning/mplib_planner.py

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.08
  base_yaw_tolerance: 0.08
  base_max_steps: 1500
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.12
  manual_base_path_yaw_tolerance: 0.08
  manual_base_path_segment_yaw_threshold: 0.05
  manual_base_path_intermediate_xy_tolerance: 0.03
  manual_base_path_intermediate_yaw_tolerance: 0.08
  # WA05 uses broad, calibrated corridors. These bounded profile limits stay
  # below the controller maxima while shortening each long traverse and turn.
  base_velocity_profile_enabled: true
  base_profile_v_max: 0.75
  base_profile_a_max: 1.8
  base_profile_a_dec: 1.5
  base_profile_v_min: 0.22
  base_profile_w_max: 1.35
  base_profile_alpha_max: 3.5
  base_profile_alpha_dec: 3.0
  base_profile_w_min: 0.20
  base_single_axis_tracking: false
  base_snap_to_target_after_success: false
  use_station_astar_paths: false
  station_nav_use_docking: false
  station_nav_dock_standoff: 0.0
  station_nav_require_footprint: false
  use_station_base_poses: true

manipulation:
  gripper:
    # Match WR-03's physical horizontal-grasp contact model. The cup remains
    # a free MuJoCo body; these values only improve real finger contact.
    force_limit: 20.0
    pad_friction: [2.0, 0.05, 0.0001]
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: mug-body-side
    pregrasp_height: 0.18
    grasp_clearance: -0.02
    lift_height: 0.12
    mug_lift_height: 0.08
    grasp_yaw_offset_deg: 0.0
    place_height: 0.0
    retreat_height: 0.14
    retreat_x: 0.0
    retreat_y: 0.0
    release_offset_x: 0.0
    release_offset_y: 0.0
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.0
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    # 0.035 rad at 20 Hz is a 0.7 rad/s command increment. A 0.05-rad trial
    # caused unacceptable terminal tracking lag during a held-cup arm return.
    max_joint_step: 0.035
    settle_steps: 15
    position_threshold: 0.12
    orientation_threshold_deg: 15.0
    qpos_threshold: 0.24
    open_steps: 5
    close_steps: 25
    release_steps: 20
    release_settle_steps: 20
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: sink,counter
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 0.8
    max_points: 4000

operations:
  cup_pick:
    # Cup poses need a tighter terminal Base pose than the collision-limited
    # sink and service samples on the same calibrated manual path.
    # A 2 cm terminal window remains well inside the arm planner's reachable
    # workspace, while avoiding the long low-speed tail needed to reach 1 cm.
    navigation_xy_tolerance: 0.02
    navigation_yaw_tolerance_rad: 0.017453292519943295
    orientation_mode: mug-body-side
    # Use the same world-frame entry sector as service placement. Angles locate
    # the pregrasp point relative to the cup: -X is 180 deg, so the gripper's
    # actual motion toward the cup is centered on +X within +/-60 deg.
    grasp_approach_sector:
      center_deg: 180.0
      half_width_deg: 60.0
    pregrasp_height: 0.18
    # The middle cup can leave the arm just below the 15-degree orientation
    # gate after the default hold. Give the joint controller time to converge
    # before validating the physical pregrasp pose.
    pregrasp_settle_steps: 30
    grasp_clearance: -0.02
    lift_height: 0.12
    grasp_yaw_offsets_deg: [0.0, -45.0, 45.0, -90.0, 90.0]
    retreat_to_pregrasp_after_grasp: true
    post_retreat_lift_height: 0.08
  sensor_faucets:
    control_mode: proximity_sensor
    hot_side: robot_left
    cold_side: robot_right
  held_fill:
    navigation_xy_tolerance: 0.03
    # Use the interactively captured full EEF pose, reanchored to the live
    # water site so both its position and orientation remain task-owned.
    use_sink_fill_calibration: true
    # Two seconds at the default 20 FPS makes the rising water level visible.
    hold_steps: 40
    gripper_action: 1.0
    cup_z_offset_from_water: -0.02
    entry_z_offset: 0.0
    # The calibrated entry and fill poses coincide. Avoid the generic 15-frame
    # hold on both identical stages; the sensor itself supplies the short
    # activation debounce and the 40-frame dwell below remains unchanged.
    entry_settle_steps: 1
    under_water_settle_steps: 1
    xy_near_water_tolerance: 0.08
    by_temperature:
      hot: {}
      cold: {}
  service_place:
    # The tracked descent can settle a few centimetres above the counter while
    # the mug is still trapped between the fingers.  Command a bounded overlap
    # so physical counter contact supports the mug before opening the gripper.
    place_height: -0.03
    placement_reference: bbox_bottom_center
    placement_object_upright: true
    placement_entry_z_offset: 0.12
    placement_exit_z_offset: 0.22
    # These are place-to-entry angles. The opposite entry-to-place motion is
    # restricted to the one-sided range 0 to -56 degrees.
    placement_approach_angles_deg: [180.0, 165.0, 150.0, 135.0, 124.0]
    # A nonzero horizontal entry distance is required for the sector to affect
    # the physical approach path rather than only the post-release exit.
    placement_entry_standoff: 0.10
    # After opening, lift vertically clear of the cup before translating. This
    # avoids the low 14 cm horizontal sweep that tipped slot_1's cup. WA-05 now
    # uses the same action-only physical handoff as WR-03: no object follow or
    # post-release pinning modifies the cup's free joint.
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.22
    release_separation_assist_distance: 0.0
    placement_exit_standoff: 0.08
    # The generic manipulation runtime otherwise adds ten stationary control
    # frames after every placement segment.  These shorter task-owned holds
    # still leave the strict Cartesian checks active at entry / place and keep
    # the independent pre-release and post-placement physical verification.
    entry_settle_steps: 2
    place_settle_steps: 3
    clearance_settle_steps: 2
    retreat_settle_steps: 1
    # Placement is released first, then record_verified_staging independently
    # verifies <= 0.12 m, region membership, support, uprightness, and release.
    service_target_xy_tolerance: 0.10
    release_distance: 0.12
    by_slot:
      slot_1:
        # slot_1 is the left-hand service slot. The generic 20 + 20 frame
        # release sequence left the arm visibly parked above it for two seconds.
        release_steps: 8
        release_settle_steps: 2
  answer_button:
    prepress_z_offset: 0.08
    press_z_offset: -0.010
    hold_steps: 12
    gripper_action: 1.0
    near_miss_position_tolerance: 0.09
    require_physical_button_motion: true
    by_temperature:
      hot: {}
      cold: {}
  return_arm:
    # Faster interpolation needs a short terminal hold so the physical joints
    # converge before Base motion starts.
    settle_steps: 5
  return_arm_holding_cup:
    # Pull the freshly grasped cup toward the robot in Base X while preserving
    # the exact grasp rotation, so the cup remains upright during navigation.
    retract_distance_base_x: 0.10
    minimum_base_x: 0.35
    lift_offset: 0.02
    settle_steps: 2
    orientation_tolerance_deg: 15.0
    max_end_effector_distance: 0.18
  sink_exit_lift:
    # The fill-to-service route moves toward decreasing island-counter local X.
    # This is the complete Sink059 exterior edge, not the basin opening and not
    # the +X edge used to constrain the initial cup sampling regions.
    sink_exterior_local_x_min: -0.4724099655124329
    boundary_geometry_tolerance: 0.002
    boundary_overshoot_tolerance: 0.020
    # Standalone-probe fallback. The expert derives this direction from the
    # sampled P10 service target and then navigates there directly.
    route_local_y_per_x: 0.02583025830258303
    boundary_translation_gain: 3.0
    boundary_min_action: 0.025
    # This controller only carries the cup across the fixed sink edge; the
    # calibrated navigation stage takes over immediately afterwards.  Match
    # its brisk corridor speed and brake before the 2 cm overshoot gate.
    boundary_max_action: 0.65
    boundary_profile_acceleration: 2.4
    boundary_profile_deceleration: 2.0
    boundary_profile_target_overshoot: 0.008
    boundary_max_steps: 450
    target_base_yaw: -0.038
    yaw_hold_gain: 0.30
    lift_offset: 0.03
    lift_position_tolerance: 0.003
    lift_correction_attempts: 2
    settle_steps: 4
    gripper_action: 1.0
    orientation_tolerance_deg: 15.0
    max_end_effector_distance: 0.18
  handlers:
    require_physical_fill: true

semantics:
  service_threshold: 0.12
  cup_upright_threshold_deg: 15.0
  release_distance: 0.12
  button_pressed_threshold_m: 0.004
  button_released_threshold_m: 0.001
  button_release_dwell_steps: 3

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
